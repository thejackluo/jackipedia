<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jackipedia</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #fff;
  color: #202122;
  font-family: -apple-system, 'Linux Libertine', Georgia, Times, serif;
  font-size: 14px;
  line-height: 1.6;
}

/* ── Top bar ── */
#topbar {
  background: #fff;
  border-bottom: 1px solid #a2a9b1;
  display: flex;
  align-items: center;
  padding: 0 12px;
  height: 50px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
#topbar .site-name {
  font-size: 1rem;
  font-weight: bold;
  color: #000;
  text-decoration: none;
  white-space: nowrap;
  font-family: sans-serif;
}
#topbar .site-name span { color: #3366cc; }
#search-form {
  display: flex;
  align-items: center;
  border: 1px solid #a2a9b1;
  border-radius: 2px;
  overflow: hidden;
  flex: 1;
  max-width: 400px;
  margin-left: auto;
}
#search-form input {
  border: none;
  padding: 5px 8px;
  font-size: 13px;
  width: 100%;
  outline: none;
  font-family: sans-serif;
}
#search-form button {
  background: #f8f9fa;
  border: none;
  border-left: 1px solid #a2a9b1;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 13px;
  color: #54595d;
}

/* ── Layout ── */
#layout {
  display: flex;
  min-height: calc(100vh - 50px);
}

/* ── Left sidebar ── */
#sidebar {
  width: 160px;
  min-height: 100%;
  background: #f8f9fa;
  border-right: 1px solid #a2a9b1;
  padding: 12px 0;
  flex-shrink: 0;
  font-size: 12.5px;
  font-family: sans-serif;
}
#sidebar .nav-section { margin-bottom: 8px; }
#sidebar .nav-heading {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #54595d;
  padding: 8px 12px 2px;
}
#sidebar a {
  display: block;
  padding: 2px 12px;
  color: #3366cc;
  text-decoration: none;
  font-size: 12.5px;
}
#sidebar a:hover { text-decoration: underline; }
#sidebar hr { border: none; border-top: 1px solid #a2a9b1; margin: 6px 0; }

/* ── Page tabs ── */
#page-tabs {
  background: #fff;
  border-bottom: 1px solid #a2a9b1;
  padding: 0 20px;
  display: flex;
  align-items: flex-end;
  gap: 0;
  font-family: sans-serif;
  font-size: 12.5px;
}
.tab {
  padding: 6px 12px;
  border: 1px solid transparent;
  border-bottom: none;
  color: #3366cc;
  text-decoration: none;
  margin-bottom: -1px;
  background: #f8f9fa;
  border-color: #a2a9b1;
  border-bottom-color: #fff;
  margin-right: 2px;
  border-radius: 2px 2px 0 0;
}
.tab:hover { text-decoration: underline; }
.tab.active { background: #fff; color: #202122; }
.tab-spacer { flex: 1; }

/* ── Right tools sidebar ── */
#right-tools {
  width: 180px;
  flex-shrink: 0;
  padding: 12px;
  font-size: 12px;
  font-family: sans-serif;
  border-left: 1px solid #eaecf0;
}
#right-tools .tools-section { margin-bottom: 12px; }
#right-tools .tools-heading {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #54595d;
  margin-bottom: 4px;
}
#right-tools a {
  display: block;
  color: #3366cc;
  text-decoration: none;
  padding: 1px 0;
}
#right-tools a:hover { text-decoration: underline; }

/* ── Main content ── */
#content-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
#page-tabs-wrap {
  border-bottom: 1px solid #a2a9b1;
}
#content {
  padding: 20px 24px 48px;
  max-width: 960px;
}

/* ── Typography ── */
h1 {
  font-family: 'Linux Libertine', Georgia, Times, serif;
  font-size: 1.95em;
  font-weight: normal;
  border-bottom: 1px solid #a2a9b1;
  padding-bottom: 4px;
  margin-bottom: 12px;
}
h2 {
  font-family: sans-serif;
  font-size: 1.3em;
  font-weight: normal;
  border-bottom: 1px solid #a2a9b1;
  margin: 24px 0 8px;
  padding-bottom: 2px;
}
h3 { font-family: sans-serif; font-size: 1.05em; font-weight: bold; margin: 16px 0 6px; }
h4 { font-size: 1em; font-weight: bold; margin: 12px 0 4px; font-family: sans-serif; }
p { margin: 8px 0; }
a { color: #3366cc; text-decoration: none; }
a:hover { text-decoration: underline; }
a:visited { color: #6b4ba6; }
ul, ol { margin: 8px 0 8px 28px; }
li { margin: 3px 0; }
code { background: #f8f9fa; border: 1px solid #a2a9b1; padding: 1px 4px; font-size: .9em; font-family: monospace; }
pre { background: #f8f9fa; border: 1px solid #a2a9b1; padding: 12px; overflow-x: auto; margin: 12px 0; font-size: 12.5px; }
blockquote { border-left: 3px solid #a2a9b1; margin: 12px 0 12px 24px; padding: 4px 12px; color: #54595d; font-style: italic; }
hr { border: none; border-top: 1px solid #a2a9b1; margin: 20px 0; }
table { border-collapse: collapse; margin: 12px 0; font-size: 13px; font-family: sans-serif; }

/* ── Images ── */
#content img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 16px 0 4px;
  border: 1px solid #a2a9b1;
}
#content figure {
  margin: 16px 0;
}
#content figcaption {
  font-size: 0.82em;
  color: #555;
  font-family: sans-serif;
  margin-top: 4px;
  font-style: italic;
}
#content p > img:only-child {
  margin: 16px auto;
}

th { background: #eaecf0; border: 1px solid #a2a9b1; padding: 5px 10px; text-align: left; }
td { border: 1px solid #a2a9b1; padding: 4px 10px; }
tr:nth-child(even) td { background: #f8f9fa; }
.page-meta { font-size: 12px; color: #54595d; font-family: sans-serif; margin-bottom: 12px; }
.categories { border-top: 1px solid #a2a9b1; margin-top: 32px; padding-top: 8px; font-size: 12.5px; font-family: sans-serif; color: #54595d; }

/* ── Footer ── */
#footer {
  border-top: 1px solid #a2a9b1;
  padding: 12px 24px;
  font-size: 12px;
  font-family: sans-serif;
  color: #54595d;
  background: #f8f9fa;
  margin-left: 160px;
}
#footer a { color: #3366cc; }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <a class="site-name" href="/index.html">Jack<span>ipedia</span></a>
  <form id="search-form" action="/meta/history.html">
    <input type="text" placeholder="Search Jackipedia" name="q">
    <button type="submit">Search</button>
  </form>
</div>

<div id="layout">

  <!-- Left sidebar -->
  <nav id="sidebar">
    <div class="nav-section">
      <div class="nav-heading">Navigation</div>
      <a href="/index.html">Main page</a>
      <a href="/meta/history.html">Recent changes</a>
      <a href="/log.html">Log</a>
    </div>
    <hr>
    <div class="nav-section">
      NAV_PLACEHOLDER
    </div>
    <hr>
    <div class="nav-section">
      <div class="nav-heading">Contribute</div>
      <a href="https://www.notion.so" target="_blank">Source (Notion)</a>
      <a href="https://jackipedia.agentschool.io">About</a>
    </div>
  </nav>

  <!-- Main content area -->
  <div id="content-wrap">

    <!-- Page tabs -->
    <div id="page-tabs-wrap">
      <div id="page-tabs">
        TABS_PLACEHOLDER
        <span class="tab-spacer"></span>
      </div>
    </div>

    <!-- Article content -->
    <div style="display:flex; flex:1;">
      <div id="content">
        CONTENT_PLACEHOLDER
      </div>
    </div>

  </div>

</div>

<!-- Footer -->
<div id="footer">
  Jackipedia — Jack Luo's personal knowledge wiki &nbsp;|&nbsp;

</div>

</body>
</html>
