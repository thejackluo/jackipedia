<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jackipedia</title>
<script>
// Apply theme before CSS renders to prevent flash
(function() {
  var saved = localStorage.getItem('jw-theme');
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<style>
/* ── Theme variables ── */
:root {
  --bg: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-topbar: #ffffff;
  --border: #a2a9b1;
  --border-light: #eaecf0;
  --text: #202122;
  --text-muted: #54595d;
  --link: #3366cc;
  --link-visited: #6b4ba6;
  --code-bg: #f8f9fa;
  --table-stripe: #f8f9fa;
  --table-head: #eaecf0;
  --blockquote-text: #54595d;
  --sidebar-bg: #f8f9fa;
  --tab-bg: #f8f9fa;
  --tab-active-bg: #ffffff;
  --footer-bg: #f8f9fa;
  --toggle-bg: #a2a9b1;
  --toggle-knob: #ffffff;
  --search-bg: #ffffff;
}

[data-theme="dark"] {
  --bg: #1a1a1b;
  --bg-secondary: #272729;
  --bg-topbar: #1a1a1b;
  --border: #3c3c3d;
  --border-light: #2d2d2e;
  --text: #d7dadc;
  --text-muted: #818384;
  --link: #4e9af1;
  --link-visited: #a47dd1;
  --code-bg: #272729;
  --table-stripe: #1f1f20;
  --table-head: #2d2d2e;
  --blockquote-text: #818384;
  --sidebar-bg: #1f1f20;
  --tab-bg: #272729;
  --tab-active-bg: #1a1a1b;
  --footer-bg: #1f1f20;
  --toggle-bg: #4e9af1;
  --toggle-knob: #ffffff;
  --search-bg: #272729;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Linux Libertine', Georgia, Times, serif;
  font-size: 14px;
  line-height: 1.6;
  transition: background 0.2s, color 0.2s;
}

/* ── Top bar ── */
#topbar {
  background: var(--bg-topbar);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  height: 50px;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 200;
}
#topbar .site-name {
  font-size: 1rem;
  font-weight: bold;
  color: var(--text);
  text-decoration: none;
  white-space: nowrap;
  font-family: sans-serif;
  flex-shrink: 0;
}
#topbar .site-name span { color: var(--link); }

/* Hamburger (mobile only) */
#menu-toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  color: var(--text);
  flex-shrink: 0;
}
#menu-toggle svg { display: block; }

#search-form {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: hidden;
  flex: 1;
  max-width: 380px;
  margin-left: auto;
}
#search-form input {
  border: none;
  padding: 5px 8px;
  font-size: 13px;
  width: 100%;
  outline: none;
  font-family: sans-serif;
  background: var(--search-bg);
  color: var(--text);
}
#search-form button {
  background: var(--bg-secondary);
  border: none;
  border-left: 1px solid var(--border);
  padding: 5px 10px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-muted);
  flex-shrink: 0;
}

/* ── Dark/light toggle ── */
#theme-toggle {
  flex-shrink: 0;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 6px;
  color: var(--text-muted);
  font-size: 17px;
  line-height: 1;
  display: flex;
  align-items: center;
  border-radius: 4px;
  transition: background 0.15s;
}
#theme-toggle:hover { background: var(--bg-secondary); }
.icon-moon { display: none; }
.icon-sun  { display: inline; }
[data-theme="dark"] .icon-moon { display: inline; }
[data-theme="dark"] .icon-sun  { display: none; }

/* ── Layout ── */
#layout {
  display: flex;
  min-height: calc(100vh - 50px);
}

/* ── Left sidebar ── */
#sidebar {
  width: 160px;
  min-height: 100%;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  padding: 12px 0;
  flex-shrink: 0;
  font-size: 12.5px;
  font-family: sans-serif;
  transition: transform 0.25s ease, background 0.2s;
}
#sidebar .nav-section { margin-bottom: 8px; }
#sidebar .nav-heading {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  padding: 8px 12px 2px;
}
#sidebar a {
  display: block;
  padding: 2px 12px;
  color: var(--link);
  text-decoration: none;
  font-size: 12.5px;
}
#sidebar a:hover { text-decoration: underline; }
#sidebar hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }

/* Sidebar overlay backdrop (mobile) */
#sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 150;
}

/* ── Page tabs ── */
#page-tabs {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex;
  align-items: flex-end;
  gap: 0;
  font-family: sans-serif;
  font-size: 12.5px;
  flex-wrap: wrap;
}
.tab {
  padding: 6px 12px;
  border: 1px solid transparent;
  border-bottom: none;
  color: var(--link);
  text-decoration: none;
  margin-bottom: -1px;
  background: var(--tab-bg);
  border-color: var(--border);
  border-bottom-color: var(--bg);
  margin-right: 2px;
  border-radius: 2px 2px 0 0;
}
.tab:hover { text-decoration: underline; }
.tab.active { background: var(--tab-active-bg); color: var(--text); }

/* Translation */
#page-history {
  scroll-margin-top: 60px;
}

#content-translation {
  display: none;
  padding: 16px 24px 24px;
  flex: 1;
  font-family: -apple-system, 'Linux Libertine', Georgia, Times, serif;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  max-width: 860px;
}
#content-translation.visible { display: block; }
.lang-toggle-btn {
  display: inline-block;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-bottom: none;
  color: var(--link);
  text-decoration: none;
  margin-bottom: -1px;
  background: var(--tab-bg);
  border-color: var(--border);
  border-bottom-color: var(--bg);
  margin-right: 2px;
  border-radius: 2px 2px 0 0;
  cursor: pointer;
  font-size: 13px;
}
.tab-spacer { flex: 1; }

/* ── Right tools sidebar ── */
#right-tools {
  width: 180px;
  flex-shrink: 0;
  padding: 12px;
  font-size: 12px;
  font-family: sans-serif;
  border-left: 1px solid var(--border-light);
}
#right-tools .tools-section { margin-bottom: 12px; }
#right-tools .tools-heading {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 4px;
}
#right-tools a {
  display: block;
  color: var(--link);
  text-decoration: none;
  padding: 1px 0;
}
#right-tools a:hover { text-decoration: underline; }

/* ── Main content ── */
#content-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
#content {
  padding: 20px 24px 48px;
  max-width: 960px;
}

/* ── Typography ── */
h1 {
  font-family: 'Linux Libertine', Georgia, Times, serif;
  font-size: 1.95em;
  font-weight: normal;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  margin-bottom: 12px;
  color: var(--text);
}
h2 {
  font-family: sans-serif;
  font-size: 1.3em;
  font-weight: normal;
  border-bottom: 1px solid var(--border);
  margin: 24px 0 8px;
  padding-bottom: 2px;
  color: var(--text);
}
h3 { font-family: sans-serif; font-size: 1.05em; font-weight: bold; margin: 16px 0 6px; color: var(--text); }
h4 { font-size: 1em; font-weight: bold; margin: 12px 0 4px; font-family: sans-serif; color: var(--text); }
p { margin: 8px 0; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
a:visited { color: var(--link-visited); }
ul, ol { margin: 8px 0 8px 28px; }
li { margin: 3px 0; }
code {
  background: var(--code-bg);
  border: 1px solid var(--border);
  padding: 1px 4px;
  font-size: .9em;
  font-family: monospace;
  color: var(--text);
}
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  padding: 12px;
  overflow-x: auto;
  margin: 12px 0;
  font-size: 12.5px;
  color: var(--text);
}
blockquote {
  border-left: 3px solid var(--border);
  margin: 12px 0 12px 24px;
  padding: 4px 12px;
  color: var(--blockquote-text);
  font-style: italic;
}
hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
table { border-collapse: collapse; margin: 12px 0; font-size: 13px; font-family: sans-serif; width: 100%; overflow-x: auto; display: block; }
th { background: var(--table-head); border: 1px solid var(--border); padding: 5px 10px; text-align: left; color: var(--text); }
td { border: 1px solid var(--border); padding: 4px 10px; color: var(--text); }
tr:nth-child(even) td { background: var(--table-stripe); }

/* ── Images ── */
#content img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 16px 0 4px;
  border: 1px solid var(--border);
}
#content figure { margin: 16px 0; }
#content figcaption {
  font-size: 0.82em;
  color: var(--text-muted);
  font-family: sans-serif;
  margin-top: 4px;
  font-style: italic;
}
#content p > img:only-child { margin: 16px auto; }

.page-meta { font-size: 12px; color: var(--text-muted); font-family: sans-serif; margin-bottom: 12px; }
.categories {
  border-top: 1px solid var(--border);
  margin-top: 32px;
  padding-top: 8px;
  font-size: 12.5px;
  font-family: sans-serif;
  color: var(--text-muted);
}

/* ── Footer ── */
#footer {
  border-top: 1px solid var(--border);
  padding: 12px 24px;
  font-size: 12px;
  font-family: sans-serif;
  color: var(--text-muted);
  background: var(--footer-bg);
  margin-left: 160px;
  transition: background 0.2s;
}
#footer a { color: var(--link); }

/* ── Mobile ── */
@media (max-width: 768px) {
  #menu-toggle { display: flex; }

  #sidebar {
    position: fixed;
    top: 50px;
    left: 0;
    bottom: 0;
    width: 240px;
    z-index: 160;
    overflow-y: auto;
    transform: translateX(-100%);
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar-backdrop.open { display: block; }

  #right-tools { display: none; }

  #content { padding: 14px 14px 48px; }

  #footer { margin-left: 0; padding: 12px 14px; }

  h1 { font-size: 1.5em; }
  h2 { font-size: 1.15em; }

  #search-form { max-width: none; }

  table { font-size: 12px; }
  td, th { padding: 4px 6px; }
}

@media (max-width: 480px) {
  #topbar { gap: 6px; padding: 0 8px; }
  #topbar .site-name { font-size: 0.9rem; }
  #content { padding: 12px 10px 40px; }
  #page-tabs { padding: 0 10px; }
  .tab { padding: 5px 8px; font-size: 11.5px; }
}

/* ── Dark mode: override hardcoded inline styles from build script ── */
[data-theme="dark"] [style*="background:#eaf3fb"],
[data-theme="dark"] [style*="background: #eaf3fb"] {
  background: #1e2a3a !important;
}
[data-theme="dark"] [style*="background:#f8f9fa"],
[data-theme="dark"] [style*="background: #f8f9fa"] {
  background: var(--bg-secondary) !important;
}
[data-theme="dark"] [style*="background:#f5fffa"],
[data-theme="dark"] [style*="background: #f5fffa"] {
  background: #1a2620 !important;
}
[data-theme="dark"] [style*="background:#fff8e6"],
[data-theme="dark"] [style*="background: #fff8e6"] {
  background: #2a2415 !important;
}
[data-theme="dark"] [style*="border:1px solid #a2a9b1"],
[data-theme="dark"] [style*="border: 1px solid #a2a9b1"] {
  border-color: var(--border) !important;
}
[data-theme="dark"] [style*="color:#54595d"],
[data-theme="dark"] [style*="color: #54595d"] {
  color: var(--text-muted) !important;
}
[data-theme="dark"] [style*="border-top:1px solid #a2a9b1"],
[data-theme="dark"] [style*="border-top: 1px solid #a2a9b1"] {
  border-top-color: var(--border) !important;
}
[data-theme="dark"] [style*="border-left:3px solid #a2a9b1"],
[data-theme="dark"] [style*="border-left: 3px solid #a2a9b1"] {
  border-left-color: var(--border) !important;
}
/* Main page two-column layout boxes */
[data-theme="dark"] .mp-col > div,
[data-theme="dark"] .mp-right > div {
  background: var(--bg-secondary) !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
}
/* Infobox / right-side boxes */
[data-theme="dark"] table.infobox,
[data-theme="dark"] .infobox {
  background: var(--bg-secondary) !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
}
[data-theme="dark"] table.infobox th {
  background: var(--table-head) !important;
  color: var(--text) !important;
}
/* Page meta bar */
[data-theme="dark"] .page-meta { color: var(--text-muted); }
/* Footer */
[data-theme="dark"] #footer { background: var(--footer-bg); color: var(--text-muted); }
/* Highlight any remaining white backgrounds inside content */
[data-theme="dark"] #content [style*="background:#fff"],
[data-theme="dark"] #content [style*="background: #fff"],
[data-theme="dark"] #content [style*="background:white"],
[data-theme="dark"] #content [style*="background: white"] {
  background: var(--bg-secondary) !important;
}
/* Make sure all text inside inline-styled divs inherits correctly */
[data-theme="dark"] #content div,
[data-theme="dark"] #content p,
[data-theme="dark"] #content li,
[data-theme="dark"] #content span {
  color: inherit;
}

/* ── Wiki boxes (main page panels) ── */
.wiki-box {
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  padding: 12px 16px;
  margin-bottom: 16px;
  color: var(--text);
}
.wiki-box-blue  { background: #eaf3fb; }
.wiki-box-green { background: #f5fffa; }
.wiki-box-yellow { background: #fff8dc; }
[data-theme="dark"] .wiki-box-blue  { background: #1e2a3a; }
[data-theme="dark"] .wiki-box-green { background: #1a2620; }
[data-theme="dark"] .wiki-box-yellow { background: #2a2415; }
.wiki-box-heading {
  font-size: 11px;
  font-family: sans-serif;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--text-muted);
  margin-bottom: 6px;
}

/* ── Random article button ── */
#random-btn {
  flex-shrink: 0;
  background: none;
  border: 1px solid var(--border);
  cursor: pointer;
  padding: 4px 8px;
  color: var(--text-muted);
  font-size: 13px;
  border-radius: 3px;
  font-family: sans-serif;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
#random-btn:hover {
  background: var(--bg-secondary);
  color: var(--link);
}
@media (max-width: 480px) {
  #random-btn { font-size: 12px; padding: 4px 6px; }
}
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <button id="menu-toggle" aria-label="Open navigation" onclick="toggleSidebar()">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
      <rect y="3" width="20" height="2" rx="1"/>
      <rect y="9" width="20" height="2" rx="1"/>
      <rect y="15" width="20" height="2" rx="1"/>
    </svg>
  </button>
  <a class="site-name" href="/index.html">Jack<span>ipedia</span></a>
  <form id="search-form" action="/search.html">
    <input type="text" placeholder="Search Jackipedia" name="q" autocomplete="off">
    <button type="submit">&#128269;</button>
  </form>
  <button id="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()">
    <span class="icon-sun">&#9788;</span>
    <span class="icon-moon">&#9790;</span>
  </button>
  <button id="random-btn" aria-label="Random article" onclick="goRandom()" title="Random article">
    &#9684;
  </button>
</div>

<!-- Sidebar backdrop (mobile) -->
<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<div id="layout">

  <!-- Left sidebar -->
  <nav id="sidebar">
    <div class="nav-section">
      <div class="nav-heading">Navigation</div>
      <a href="/index.html">Main page</a>
      <a href="/meta/history.html">Recent changes</a>
      <a href="/log.html">Log</a>
      <a href="#" id="random-article-link" onclick="goRandom(); return false;">Random article</a>
    </div>
    <hr>
    <div class="nav-section">
      NAV_PLACEHOLDER
    </div>
    <hr>
    <div class="nav-section">
      <div class="nav-heading">Contribute</div>
      <a href="https://www.notion.so" target="_blank">Source (Notion)</a>
      <a href="https://jackipedia.agentschool.io">About</a>
    </div>
  </nav>

  <!-- Main content area -->
  <div id="content-wrap">

    <!-- Page tabs -->
    <div id="page-tabs-wrap">
      <div id="page-tabs">
        TABS_PLACEHOLDER
        <span class="tab-spacer"></span>
      </div>
    </div>

    <!-- Article content -->
    <div style="display:flex; flex:1;">
      <div id="content">
        CONTENT_PLACEHOLDER
      </div>
      TRANSLATION_PLACEHOLDER
    </div>

  </div>

</div>

<!-- Footer -->
<div id="footer">
  Jackipedia &mdash; Jack Luo's personal knowledge wiki &nbsp;|&nbsp;
  <a href="/meta/history.html">Recent changes</a> &nbsp;|&nbsp;
  <a href="/log.html">Log</a> &nbsp;|&nbsp;
  Powered by git + pandoc
</div>

<script src="/random-articles.js"></script>
<script>
// ── Theme ──
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('jw-theme', next);
}

// ── Language toggle ──
function toggleLang(btn, langLabel) {
  const eng = document.getElementById('content');
  const tra = document.getElementById('content-translation');
  if (!tra) return;
  const isTranslation = tra.classList.contains('visible');
  if (isTranslation) {
    tra.classList.remove('visible');
    eng.style.display = '';
    btn.textContent = langLabel;
  } else {
    tra.classList.add('visible');
    eng.style.display = 'none';
    btn.textContent = 'English';
  }
}

// ── Random article ──
function goRandom() {
  if (typeof JACKIPEDIA_ARTICLES === 'undefined' || !JACKIPEDIA_ARTICLES.length) return;
  const url = JACKIPEDIA_ARTICLES[Math.floor(Math.random() * JACKIPEDIA_ARTICLES.length)];
  window.location.href = url;
}

// ── Sidebar (mobile) ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
}
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('#sidebar a').forEach(function(link) {
    link.addEventListener('click', closeSidebar);
  });
});
</script>

</body>
</html>
