<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Jackipedia</title>
<script>
(function(){
  var saved = localStorage.getItem('jw-theme');
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<style>
:root {
  --bg: #ffffff; --bg-secondary: #f8f9fa; --bg-topbar: #ffffff;
  --border: #a2a9b1; --border-light: #eaecf0; --text: #202122;
  --text-muted: #54595d; --link: #3366cc; --link-visited: #6b4ba6;
  --code-bg: #f8f9fa; --sidebar-bg: #f8f9fa; --footer-bg: #f8f9fa;
  --search-bg: #ffffff; --toggle-bg: #a2a9b1; --highlight: #ffe066;
}
[data-theme="dark"] {
  --bg: #1a1a1b; --bg-secondary: #272729; --bg-topbar: #1a1a1b;
  --border: #3c3c3d; --border-light: #2d2d2e; --text: #d7dadc;
  --text-muted: #818384; --link: #4e9af1; --link-visited: #a47dd1;
  --code-bg: #272729; --sidebar-bg: #1f1f20; --footer-bg: #1f1f20;
  --search-bg: #272729; --highlight: #7a6a00;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, 'Linux Libertine', Georgia, Times, serif;
  font-size: 14px; line-height: 1.6;
}

/* Topbar */
#topbar {
  background: var(--bg-topbar); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; height: 50px;
  gap: 10px; position: sticky; top: 0; z-index: 200;
}
#topbar .site-name {
  font-size: 1rem; font-weight: bold; color: var(--text);
  text-decoration: none; white-space: nowrap; font-family: sans-serif; flex-shrink: 0;
}
#topbar .site-name span { color: var(--link); }
#menu-toggle {
  display: none; background: none; border: none; cursor: pointer;
  padding: 6px; color: var(--text); flex-shrink: 0;
}
#search-form {
  display: flex; align-items: center; border: 1px solid var(--border);
  border-radius: 2px; overflow: hidden; flex: 1; max-width: 380px; margin-left: auto;
}
#search-form input {
  border: none; padding: 5px 8px; font-size: 13px; width: 100%;
  outline: none; font-family: sans-serif; background: var(--search-bg); color: var(--text);
}
#search-form button {
  background: var(--bg-secondary); border: none; border-left: 1px solid var(--border);
  padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--text-muted); flex-shrink: 0;
}
#theme-toggle {
  flex-shrink: 0; background: none; border: none; cursor: pointer;
  padding: 4px 6px; color: var(--text-muted); font-size: 17px; line-height: 1;
  display: flex; align-items: center; border-radius: 4px;
}
#theme-toggle:hover { background: var(--bg-secondary); }
.icon-moon { display: none; }
.icon-sun { display: inline; }
[data-theme="dark"] .icon-moon { display: inline; }
[data-theme="dark"] .icon-sun { display: none; }
#random-btn {
  flex-shrink: 0; background: none; border: 1px solid var(--border);
  cursor: pointer; padding: 4px 8px; color: var(--text-muted);
  font-size: 13px; border-radius: 3px; font-family: sans-serif; white-space: nowrap;
}
#random-btn:hover { background: var(--bg-secondary); color: var(--link); }

/* Layout */
#layout { display: flex; min-height: calc(100vh - 50px); }

/* Sidebar */
#sidebar {
  width: 160px; min-height: 100%; background: var(--sidebar-bg);
  border-right: 1px solid var(--border); padding: 12px 0;
  flex-shrink: 0; font-size: 12.5px; font-family: sans-serif;
}
#sidebar .nav-heading {
  font-size: 11px; font-weight: bold; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--text-muted); padding: 8px 12px 2px;
}
#sidebar a { display: block; padding: 2px 12px; color: var(--link); text-decoration: none; }
#sidebar a:hover { text-decoration: underline; }
#sidebar hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
#sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; }

/* Content */
#content-wrap { flex: 1; min-width: 0; }
#content { padding: 24px; max-width: 860px; }

h1 {
  font-family: 'Linux Libertine', Georgia, Times, serif; font-size: 1.95em;
  font-weight: normal; border-bottom: 1px solid var(--border);
  padding-bottom: 4px; margin-bottom: 16px;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
a:visited { color: var(--link-visited); }

/* Search UI */
#search-box-wrap { margin-bottom: 1.5rem; }
#search-input-large {
  width: 100%; font-size: 1.1rem; padding: 0.6rem 1rem;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg); color: var(--text); outline: none;
}
#search-input-large:focus { border-color: var(--link); }

#search-count { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; font-family: sans-serif; }

.result-item { border-bottom: 1px solid var(--border-light); padding: 0.9rem 0; }
.result-item:last-child { border-bottom: none; }
.result-cat {
  font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 3px; font-family: sans-serif;
}
.result-item h3 { margin: 0 0 4px; font-size: 1.05rem; font-family: sans-serif; font-weight: 600; }
.result-item h3 a { color: var(--link); text-decoration: none; }
.result-item h3 a:hover { text-decoration: underline; }
.result-summary { font-size: 0.9rem; color: var(--text-muted); margin: 0; font-family: sans-serif; }
.result-summary mark { background: var(--highlight); color: inherit; border-radius: 2px; padding: 0 2px; }

/* Footer */
#footer {
  border-top: 1px solid var(--border); padding: 12px 24px;
  font-size: 12px; font-family: sans-serif; color: var(--text-muted);
  background: var(--footer-bg); margin-left: 160px;
}
#footer a { color: var(--link); }

/* Mobile */
@media (max-width: 768px) {
  #menu-toggle { display: flex; }
  #sidebar {
    position: fixed; top: 50px; left: 0; bottom: 0; width: 240px;
    z-index: 160; overflow-y: auto; transform: translateX(-100%);
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar-backdrop.open { display: block; }
  #content { padding: 14px; }
  #footer { margin-left: 0; }
  #search-form { max-width: none; }
}
</style>
</head>
<body>

<div id="topbar">
  <button id="menu-toggle" aria-label="Open navigation" onclick="toggleSidebar()">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
      <rect y="3" width="20" height="2" rx="1"/>
      <rect y="9" width="20" height="2" rx="1"/>
      <rect y="15" width="20" height="2" rx="1"/>
    </svg>
  </button>
  <a class="site-name" href="/index.html">Jack<span>ipedia</span></a>
  <form id="search-form" onsubmit="doSearchTop(event)">
    <input type="text" placeholder="Search Jackipedia" id="q-top" autocomplete="off">
    <button type="submit">&#128269;</button>
  </form>
  <button id="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()">
    <span class="icon-sun">&#9788;</span>
    <span class="icon-moon">&#9790;</span>
  </button>
  <button id="random-btn" onclick="goRandom()" title="Random article">&#9684;</button>
</div>

<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<div id="layout">
  <nav id="sidebar">
    <div class="nav-section">
      <div class="nav-heading">Navigation</div>
      <a href="/index.html">Main page</a>
      <a href="/meta/history.html">Recent changes</a>
      <a href="#" onclick="goRandom(); return false;">Random article</a>
    </div>
    <hr>
    <div class="nav-section">
      <div class="nav-heading">People</div>
      <a href="/wiki/people/jack-luo.html">Jack Luo</a>
      <a href="/wiki/people/index.html">All people</a>
    </div>
    <div class="nav-section">
      <div class="nav-heading">Categories</div>
      <a href="/wiki/concepts/reading-list.html">Books</a>
      <a href="/wiki/history/index.html">History</a>
      <a href="/wiki/philosophy/walk-in-the-park-framework.html">Philosophy</a>
      <a href="/wiki/projects/index.html">Projects</a>
    </div>
  </nav>

  <div id="content-wrap">
    <div id="content">
      <h1>Search Jackipedia</h1>
      <div id="search-box-wrap">
        <input id="search-input-large" type="text" placeholder="Type to search all articles..." autofocus autocomplete="off">
      </div>
      <div id="search-count"></div>
      <div id="search-results"></div>
    </div>
  </div>
</div>

<div id="footer">
  Jackipedia &mdash; Jack Luo's personal knowledge wiki &nbsp;|&nbsp;
  <a href="/meta/history.html">Recent changes</a> &nbsp;|&nbsp;
  <a href="/index.html">Main page</a>
</div>

<script src="/random-articles.js"></script>
<script>
function toggleTheme() {
  var html = document.documentElement;
  var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('jw-theme', next);
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
}
function goRandom() {
  if (typeof JACKIPEDIA_ARTICLES !== 'undefined' && JACKIPEDIA_ARTICLES.length) {
    window.location.href = JACKIPEDIA_ARTICLES[Math.floor(Math.random() * JACKIPEDIA_ARTICLES.length)];
  }
}

var INDEX = null;

async function loadIndex() {
  if (INDEX) return INDEX;
  var r = await fetch('/search-index.json');
  INDEX = await r.json();
  return INDEX;
}

function countOccurrences(str, term) {
  var count = 0, pos = 0;
  while ((pos = str.indexOf(term, pos)) !== -1) { count++; pos += term.length; }
  return count;
}

function highlight(text, terms) {
  // Find the best snippet — the region with highest density of term matches
  var full = (text || '');
  var best_pos = 0, best_score = 0;
  var lower = full.toLowerCase();
  for (var i = 0; i < Math.max(1, full.length - 200); i += 40) {
    var chunk = lower.slice(i, i + 200);
    var s = terms.reduce(function(acc, t) { return acc + countOccurrences(chunk, t); }, 0);
    if (s > best_score) { best_score = s; best_pos = i; }
  }
  var snippet = full.slice(best_pos, best_pos + 240);
  if (best_pos > 0) snippet = '…' + snippet;
  terms.forEach(function(t) {
    var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    snippet = snippet.replace(re, '<mark>$1</mark>');
  });
  return snippet;
}

async function runSearch(query) {
  var resultsEl = document.getElementById('search-results');
  var countEl = document.getElementById('search-count');
  if (!query.trim()) { resultsEl.innerHTML = ''; countEl.textContent = ''; return; }

  var idx = await loadIndex();
  var queryL = query.toLowerCase().trim();
  var terms = queryL.split(/\s+/).filter(Boolean);

  var scored = [];
  for (var i = 0; i < idx.length; i++) {
    var item = idx[i];
    var titleL = item.title.toLowerCase();
    var summaryL = (item.summary || '').toLowerCase();
    var bodyL = (item.body || '').toLowerCase();
    var tagsL = (item.tags || '').toLowerCase();
    var score = 0;
    var allMatch = true;

    for (var j = 0; j < terms.length; j++) {
      var t = terms[j];
      var inTitle   = titleL.includes(t);
      var inSummary = summaryL.includes(t);
      var inBody    = bodyL.includes(t);
      var inTags    = tagsL.includes(t);
      if (!inTitle && !inSummary && !inBody && !inTags) { allMatch = false; break; }
      // Weighted scoring
      if (inTitle)   score += 20 + countOccurrences(titleL, t) * 5;
      if (inSummary) score += 8  + countOccurrences(summaryL, t) * 2;
      if (inBody)    score += 1  + countOccurrences(bodyL, t);
      if (inTags)    score += 15;
    }
    if (!allMatch) continue;

    // Exact phrase bonus
    if (terms.length > 1 && titleL.includes(queryL))   score += 50;
    if (terms.length > 1 && summaryL.includes(queryL)) score += 20;
    if (terms.length > 1 && bodyL.includes(queryL))    score += 10;

    // Category relevance boost — people/projects/history rank higher for proper nouns
    var firstTermCap = query.trim()[0] === query.trim()[0].toUpperCase();
    if (firstTermCap && ['people','projects','history'].includes(item.cat)) score += 5;

    scored.push({ item: item, score: score });
  }
  scored.sort(function(a, b) { return b.score - a.score; });

  countEl.textContent = scored.length === 0
    ? 'No results for "' + query + '"'
    : scored.length + ' result' + (scored.length === 1 ? '' : 's') + ' for "' + query + '"';

  if (scored.length === 0) {
    resultsEl.innerHTML = '<p style="color:var(--text-muted);font-family:sans-serif;">Try a different search term.</p>';
    return;
  }

  resultsEl.innerHTML = scored.slice(0, 30).map(function(s) {
    var item = s.item;
    var snippet = highlight((item.summary && item.summary.length > 40) ? item.summary : item.body, terms);
    return '<div class="result-item">' +
      '<div class="result-cat">' + (item.cat || '') + '</div>' +
      '<h3><a href="' + item.url + '">' + item.title + '</a></h3>' +
      '<p class="result-summary">' + snippet + '</p>' +
      '</div>';
  }).join('');
}

function doSearchTop(e) {
  if (e) e.preventDefault();
  var q = document.getElementById('q-top').value;
  document.getElementById('search-input-large').value = q;
  window.history.replaceState({}, '', '/search.html?q=' + encodeURIComponent(q));
  runSearch(q);
}

document.getElementById('search-input-large').addEventListener('input', function() {
  runSearch(this.value);
});

window.addEventListener('DOMContentLoaded', function() {
  var params = new URLSearchParams(window.location.search);
  var q = params.get('q') || '';
  if (q) {
    document.getElementById('search-input-large').value = q;
    document.getElementById('q-top').value = q;
    runSearch(q);
  }
});
</script>
</body>
</html>
